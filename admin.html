<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ویرایش محتوای سایت</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f6;
      --panel: #fff;
      --line: #e6e6ea;
      --text: #1d1d20;
      --muted: #77777f;
      --accent: #8f00ff;
      --accent-soft: rgba(143, 0, 255, .08);
      --danger: #d92d4a;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Vazirmatn, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* top bar */
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .bar h1 { font-size: 16px; margin: 0 0 0 auto; font-weight: 700; }
    .status { font-size: 12px; color: var(--muted); }
    .status.dirty { color: var(--accent); }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #fafafa; }
    .btn--primary { background: #262626; color: #fff; border-color: #262626; }
    .btn--primary:hover { background: #000; }
    .btn--ghost { border-color: transparent; color: var(--muted); }
    .btn--small { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
    .btn--danger { color: var(--danger); }

    .banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: #fff8e6;
      border-bottom: 1px solid #f3e2b3;
      font-size: 13px;
    }
    .banner.show { display: flex; }

    /* layout */
    .layout { flex: 1; display: grid; grid-template-columns: 440px 1fr; min-height: 0; }
    .form { overflow-y: auto; padding: 16px; border-left: 1px solid var(--line); background: var(--bg); }
    .preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .preview-tools {
      display: flex; gap: 8px; align-items: center; padding: 10px 16px;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
    .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stage { flex: 1; overflow: hidden; position: relative; background: #e9e9ee; }
    .frame-wrap { position: absolute; top: 0; transform-origin: top right; background: #fff; box-shadow: 0 0 0 1px var(--line); }
    .frame-wrap iframe { border: 0; width: 100%; height: 100%; display: block; }

    /* sections */
    details.section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 10px;
    }
    details.section > summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    details.section > summary::-webkit-details-marker { display: none; }
    details.section > summary::after { content: "+"; margin-right: auto; color: var(--muted); font-weight: 400; font-size: 18px; }
    details.section[open] > summary::after { content: "−"; }
    .page-tag { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
    .section-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-weight: 500; font-size: 13px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .field input[type=text], .field input[type=number], .field textarea, .field select {
      font-family: inherit;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      background: #fff;
      line-height: 1.6;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
    .ltr { direction: ltr; text-align: left; font-family: "Helvetica Neue", Arial, sans-serif; }
    .rtl { direction: rtl; text-align: right; }
    .pair { display: grid; gap: 6px; }
    .pair-item { position: relative; }
    .lang-tag {
      position: absolute; top: 9px; right: 8px;
      font-size: 10px; font-weight: 700; color: var(--muted);
      background: var(--bg); border-radius: 6px; padding: 1px 6px; pointer-events: none;
    }
    .pair-item .ltr { padding-right: 40px !important; }
    .pair-item .rtl { padding-left: 40px !important; }
    .pair-item.is-fa .lang-tag { right: auto; left: 8px; }

    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .color-row input[type=color] { flex: 0 0 44px; height: 40px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .thumb { flex: 0 0 48px; height: 48px; border-radius: 8px; border: 1px solid var(--line); background: #fafafa center/contain no-repeat; display: grid; place-items: center; font-size: 10px; color: var(--muted); }

    .sub-heading { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
    .sub-heading strong { font-size: 14px; }
    .action-btn { align-self: flex-start; }

    .banner--lock { background: #f3f0ff; border-bottom-color: #e2dafc; flex-wrap: wrap; }
    .banner--lock input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 180px; }
    .lock-msg { font-size: 12px; color: var(--danger); }
    .secret-box { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: #f6f3ff; }
    .secret-box input { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; background: #fff; direction: ltr; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: #262626; }

    /* upload field */
    .drop {
      display: flex; gap: 12px; align-items: stretch;
      border: 1px dashed #d4d4da; border-radius: 12px; padding: 10px; background: #fff;
      transition: border-color .2s, background .2s;
    }
    .drop.is-over { border-color: var(--accent); background: var(--accent-soft); }
    .drop .thumb { flex: 0 0 72px; height: 72px; }
    .drop-main { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .drop-actions { justify-content: flex-start; }
    .drop-actions > * { flex: none; }
    .drop-tip { font-size: 11px; color: var(--muted); margin-inline-start: auto; align-self: center; }
    .spec {
      font-size: 12px; line-height: 1.8; color: var(--text);
      background: var(--bg); border-radius: 8px; padding: 6px 10px;
    }
    .spec b { font-weight: 700; }
    .upload-status { font-size: 12px; color: var(--muted); min-height: 0; }
    .upload-status:empty { display: none; }
    .upload-status.ok { color: #1f8a4c; }
    .upload-status.warn { color: #b26a00; }
    .upload-status.err { color: var(--danger); }
    .pending-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-inline-end: 6px; vertical-align: middle; }

    /* lists */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item { border: 1px solid var(--line); border-radius: 12px; background: #fcfcfd; }
    .item > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; align-items: center; gap: 6px; }
    .item > summary::-webkit-details-marker { display: none; }
    .item-title { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-tools { display: flex; gap: 2px; }
    .icon-btn { border: 0; background: none; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .icon-btn:hover { background: var(--bg); color: var(--text); }
    .icon-btn.del:hover { color: var(--danger); }
    .item-body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
    .add-btn { border: 1px dashed #cfcfd6; background: none; border-radius: 10px; padding: 9px; cursor: pointer; color: var(--muted); }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* dialog */
    dialog { border: 0; border-radius: 16px; padding: 24px; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    dialog h2 { margin: 0 0 12px; font-size: 17px; }
    dialog ol { padding-right: 20px; line-height: 2; margin: 0 0 16px; }
    code { direction: ltr; unicode-bidi: embed; background: var(--bg); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .preview { display: none; }
      .form { border: 0; }
    }
  </style>
</head>
<body>

  <div class="bar">
    <h1>ویرایش محتوای سایت</h1>
    <span class="status" id="status">بدون تغییر</span>
    <label class="btn btn--ghost" for="import-file">باز کردن فایل…</label>
    <input type="file" id="import-file" accept=".js,.json" hidden>
    <button class="btn btn--ghost" id="reset">برگشت به نسخهٔ سایت</button>
    <button class="btn btn--primary" id="download">دانلود برای آپلود</button>
  </div>

  <div class="banner banner--lock" id="lock-banner">
    <span>چند کیس‌استادی رمزدار است. برای ویرایش‌شان رمز را وارد کن (بقیهٔ بخش‌ها بدون رمز هم قابل ویرایش‌اند).</span>
    <input type="password" id="lock-pass" placeholder="رمز کیس‌استادی‌ها" autocomplete="current-password">
    <button class="btn btn--small" id="lock-open">باز کردن</button>
    <span class="lock-msg" id="lock-msg"></span>
  </div>
  <div class="banner" id="draft-banner">
    <span>تغییرات ذخیره‌نشدهٔ قبلی‌ات پیدا و بارگذاری شد.</span>
    <button class="btn btn--small" id="discard-draft">کنار گذاشتن و شروع از نسخهٔ سایت</button>
  </div>

  <div class="layout">
    <div class="form" id="form"></div>

    <div class="preview">
      <div class="preview-tools">
        <div class="seg" id="page-seg">
          <button type="button" data-page="index.html" aria-pressed="true">صفحهٔ اصلی</button>
          <button type="button" data-page="about.html" aria-pressed="false">درباره من</button>
        </div>
        <div class="seg" id="lang-seg">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="fa" aria-pressed="false">فا</button>
        </div>
        <div class="seg" id="device-seg">
          <button type="button" data-w="1440" aria-pressed="true">دسکتاپ</button>
          <button type="button" data-w="390" aria-pressed="false">موبایل</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <div class="frame-wrap" id="frame-wrap"><iframe id="frame" src="index.html" title="پیش‌نمایش سایت"></iframe></div>
      </div>
    </div>
  </div>

  <dialog id="done-dialog">
    <h2 id="done-title"></h2>
    <ol id="done-steps"></ol>
    <p class="hint" id="done-note"></p>
    <form method="dialog" style="text-align:left"><button class="btn btn--primary">باشه</button></form>
  </dialog>

      previewLang = l;
      document.querySelectorAll("#lang-seg button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l));
      });
      send();
    }
    document.getElementById("lang-seg").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (b) setPreviewLang(b.getAttribute("data-lang"));
    });

    function previewCase(item) {
      var i = (data.projects || []).indexOf(item);
      if (i < 0) return;
      showPage("index.html");
      var go = function () { try { frame.contentWindow.postMessage({ type: "open-case", index: i }, "*"); } catch (e) {} };
      setTimeout(go, frame.getAttribute("src") === "index.html" ? 50 : 600);
    }
    function send() {
      try { frame.contentWindow.postMessage({ type: "preview-content", content: withPending(data), lang: previewLang }, "*"); } catch (e) {}
    }
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "preview-ready" && e.source === frame.contentWindow) send();
    });
    frame.addEventListener("load", send);

    function fit() {
      var sw = stage.clientWidth, sh = stage.clientHeight;
      var scale = Math.min(1, (sw - 32) / deviceW);
      wrap.style.width = deviceW + "px";
      wrap.style.height = (sh / scale) + "px";
      wrap.style.transform = "scale(" + scale + ")";
      wrap.style.right = Math.max(0, (sw - deviceW * scale) / 2) + "px";
    }
    window.addEventListener("resize", fit);

    function showPage(p) {
      if (frame.getAttribute("src") !== p) frame.setAttribute("src", p);
      document.querySelectorAll("#page-seg button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-page") === p));
      });
    }
    document.getElementById("page-seg").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (b) showPage(b.getAttribute("data-page"));
    });
    document.getElementById("device-seg").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      deviceW = +b.getAttribute("data-w");
      this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      fit();
    });

    /* ---------- export / import / reset ---------- */
    function download(blob, name) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    }
    function showDone(title, steps, note) {
      document.getElementById("done-title").textContent = title;
      document.getElementById("done-steps").innerHTML = steps.map(function (x) { return "<li>" + x + "</li>"; }).join("");
      document.getElementById("done-note").innerHTML = note || "";
      document.getElementById("done-dialog").showModal();
    }
    document.getElementById("download").addEventListener("click", function () {
      var btn = this;
      btn.disabled = true;
      var label = btn.textContent;
      btn.textContent = "در حال آماده‌سازی…";
      buildExport().then(function (res) {
        var js = "/* Site content — edit with admin.html, then upload this file to GitHub. */\n" +
          "window.SITE_CONTENT = " + JSON.stringify(res.out, null, 2) + ";\n";
        var plain = usedPending(res.out);
        var leftNote = res.publicLeft.length
          ? "<br><br><b>مهم:</b> این تصویرها قبلاً بدون رمز روی گیت‌هاب گذاشته شده‌اند و هنوز عمومی‌اند. نسخهٔ رمزدارشان داخل بسته است؛ بعد از آپلود، خود این فایل‌ها را از گیت‌هاب پاک کن:<br><code>" + res.publicLeft.join("</code><br><code>") + "</code>"
          : "";
        if (!plain.length && !res.files.length) {
          download(new Blob([js], { type: "text/javascript" }), "content.js");
          markClean("دانلود شد");
          showDone("فایل دانلود شد", [
            "در گیت‌هاب ریپازیتوری سایت را باز کن.",
            "روی <b>Add file</b> و بعد <b>Upload files</b> بزن.",
            "فایل <code>content.js</code> را بکش و رها کن (جای قبلی را می‌گیرد).",
            "<b>Commit changes</b> را بزن. چند دقیقه بعد سایت به‌روز می‌شود."
          ], leftNote);
          return;
        }
        return Promise.all(plain.map(function (p) {
          return pending[p].blob.arrayBuffer().then(function (buf) { return { name: p, data: new Uint8Array(buf) }; });
        })).then(function (entries) {
          entries.unshift({ name: "content.js", data: new TextEncoder().encode(js) });
          entries = entries.concat(res.files);
          download(makeZip(entries), "site-update.zip");
          markClean("دانلود شد");
          showDone("بستهٔ به‌روزرسانی دانلود شد", [
            "فایل <code>site-update.zip</code> را از حالت فشرده خارج کن. داخلش <code>content.js</code> و پوشهٔ <code>assets</code> است.",
            "در گیت‌هاب ریپازیتوری سایت را باز کن و <b>Add file</b> ← <b>Upload files</b> را بزن.",
            "<code>content.js</code> و پوشهٔ <code>assets</code> را <b>با هم</b> بکش و رها کن. گیت‌هاب ساختار پوشه‌ها را نگه می‌دارد و فایل‌های هم‌نام را جایگزین می‌کند.",
            "<b>Commit changes</b> را بزن. چند دقیقه بعد سایت به‌روز می‌شود."
          ], fa(entries.length - 1) + " فایل داخل بسته است" + (res.files.length ? " (" + fa(res.files.length) + " تصویر رمزنگاری‌شده در <code>assets/private</code>)" : "") + ". عکسی که از فرم حذف کرده‌ای روی گیت‌هاب می‌ماند؛ اگر خواستی، از داخل پوشهٔ <code>assets</code> در گیت‌هاب پاکش کن." + leftNote);
        });
      }).catch(function (err) {
        alert(err && err.message ? err.message : "مشکلی پیش آمد؛ دوباره امتحان کن.");
      }).then(function () { btn.disabled = false; btn.textContent = label; });
    });

    document.getElementById("import-file").addEventListener("change", function () {
      var file = this.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var t = String(reader.result);
          var start = t.indexOf("{"), end = t.lastIndexOf("}");
          data = JSON.parse(t.slice(start, end + 1));
          buildForm(); touch();
        } catch (err) {
          alert("این فایل خوانده نشد. فقط content.js یا یک فایل JSON با همان ساختار را باز کن.");
        }
      };
      reader.readAsText(file);
      this.value = "";
    });

    function resetToOriginal() {
      data = JSON.parse(JSON.stringify(original));
      pending = {}; IDB.clear();
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      document.getElementById("draft-banner").classList.remove("show");
      buildForm(); send(); markClean();
    }
    document.getElementById("reset").addEventListener("click", function () {
      if (dirty && !confirm("همهٔ تغییرات این صفحه پاک شود و محتوای فعلی سایت برگردد؟")) return;
      resetToOriginal();
    });
    document.getElementById("discard-draft").addEventListener("click", resetToOriginal);

    window.addEventListener("beforeunload", function (e) {
      if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    /* ---------- init ---------- */
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
    // Ignore drafts saved by the older single-language admin
    if (draft && !(draft.nav && draft.nav.caseStudies)) { draft = null; try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
    if (draft && JSON.stringify(draft) !== JSON.stringify(original)) {
      data = draft;
      document.getElementById("draft-banner").classList.add("show");
      dirty = true;
      document.getElementById("status").textContent = "تغییرات دانلود نشده";
      document.getElementById("status").className = "status dirty";
    } else {
      data = JSON.parse(JSON.stringify(original));
    }
    function refreshLockBanner() {
      document.getElementById("lock-banner").classList.toggle("show", stillLocked());
    }
    document.getElementById("lock-open").addEventListener("click", function () {
      var pw = document.getElementById("lock-pass").value, msg = document.getElementById("lock-msg");
      if (!pw) return;
      msg.textContent = "…";
      unlockAll(pw).then(function () {
        msg.textContent = "";
        try { sessionStorage.setItem("admin-case-pass", pw); } catch (e) {}
        refreshLockBanner(); buildForm(); send();
      }, function () { msg.textContent = "رمز درست نیست."; });
    });
    document.getElementById("lock-pass").addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("lock-open").click(); });
    refreshLockBanner();
    if (stillLocked() && secret.password && data.protection) {
      unlockAll(secret.password).then(function () { refreshLockBanner(); buildForm(); send(); }, function () {});
    }

    IDB.all().then(function (stored) {
      var keys = Object.keys(stored);
      return Promise.all(keys.map(function (p) {
        // Drop an upload once the same file is live on the site (same size); keep it otherwise.
        return fetch(p + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw 0;
          return r.blob();
        }).then(function (live) {
          var referenced = JSON.stringify(original).indexOf(JSON.stringify(p)) > -1;
          if (referenced && live.size === stored[p].size) { IDB.del(p); return; }
          return addPending(p, stored[p]);
        }).catch(function () { return addPending(p, stored[p]); });
      }));
    }).then(function () {
      buildForm();
      fit();
      send();
    });
    buildForm();
    fit();
  })();
  </script>
</body>
</html>
